# Publishes public/ to GitHub Pages on every push to main.
# A workflow is used rather than Pages' "deploy from a branch" setting because
# that setting can only serve the repo root or /docs, and the site lives in
# public/ — the same directory Cloudflare Pages builds from.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # actions: read is for the wait step near the bottom, which asks this run's
  # own artifact list whether the upload has become visible yet.
  actions: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # All four actions are kept on a current major for one reason: the ones
      # that were here ran on Node 20, which GitHub has deprecated. Every run
      # ended with "Node.js 20 is deprecated... being forced to run on Node.js
      # 24" — a warning today, a hard failure whenever GitHub finishes removing
      # Node 20 from the runners. The majors below all run Node 24 natively.
      #
      # checkout is on v5 rather than v7 deliberately. v6 and v7 only change
      # how fork pull requests are checked out under pull_request_target and
      # workflow_run; this workflow runs on push to main and workflow_dispatch,
      # so that buys nothing here, and v5 already clears the Node 20 problem.
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      # v4 stopped including hidden files in the artifact. Checked before
      # bumping: public/ has no dotfiles at all — no .nojekyll, nothing — so
      # nothing is silently dropped. If a dotfile is ever added under public/
      # and it needs to be served, this is the line that will quietly omit it.
      # (The _template directories are safe: this deploy path serves the
      # artifact as it is and never runs Jekyll, which is what would otherwise
      # skip an underscore-prefixed folder.)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # Why this step exists, since it looks like superstition.
      #
      # deploy-pages asks the REST artifacts API for the artifact the step
      # above just uploaded, and on this repo it has three times been answered
      # "Found 0 artifact(s)" — 24 Nov, and twice on 25 Nov. It treats that
      # answer as final and fails the run; its backoff covers the polling it
      # does *after* a deployment is created, not this first lookup.
      #
      # It is a visibility delay, not a failed upload. Measured on the 25 Nov
      # re-run: the artifact was created at 06:34:37 and really existed (29 MB,
      # unexpired, fetchable through the same REST endpoint a minute later),
      # and deploy-pages asked at 06:34:37.9 — under a second after — and was
      # told there were none. So the fix is not to re-upload or to re-run; it
      # is to not ask until the answer can be right.
      #
      # Written as a wait rather than a fixed sleep so that it costs a couple
      # of seconds on a normal run and still covers a slow one, and so that a
      # genuine upload failure still fails the run instead of being papered
      # over by a sleep that was long enough.
      - name: Wait until the artifact is visible to the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            n=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$n" -ge 1 ]; then
              echo "github-pages artifact visible after $i check(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the github-pages artifact never became visible to the API"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5
