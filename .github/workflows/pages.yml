# Publishes public/ to GitHub Pages on every push to main.
# A workflow is used rather than Pages' "deploy from a branch" setting because
# that setting can only serve the repo root or /docs, and the site lives in
# public/ — the same directory Cloudflare Pages builds from.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # actions: read is for the upload check below, which asks this run's own
  # artifact list through the REST API. An explicit permissions block denies
  # everything it does not name, including that endpoint.
  actions: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Either attempt can be the one that published; see the retry below.
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # All four actions are kept on a current major for one reason: the ones
      # that were here ran on Node 20, which GitHub has deprecated. Every run
      # ended with "Node.js 20 is deprecated... being forced to run on Node.js
      # 24" — a warning today, a hard failure whenever GitHub finishes removing
      # Node 20 from the runners. The majors below all run Node 24 natively.
      #
      # checkout is on v5 rather than v7 deliberately. v6 and v7 only change
      # how fork pull requests are checked out under pull_request_target and
      # workflow_run; this workflow runs on push to main and workflow_dispatch,
      # so that buys nothing here, and v5 already clears the Node 20 problem.
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      # v4 stopped including hidden files in the artifact. Checked before
      # bumping: public/ has no dotfiles at all — no .nojekyll, nothing — so
      # nothing is silently dropped. If a dotfile is ever added under public/
      # and it needs to be served, this is the line that will quietly omit it.
      # (The _template directories are safe: this deploy path serves the
      # artifact as it is and never runs Jekyll, which is what would otherwise
      # skip an underscore-prefixed folder.)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # This is a check, not the fix. It proves the upload really happened,
      # so that a genuinely broken upload fails here with a clear message
      # instead of being blamed on the race below. It cannot prove that
      # deploy-pages will see the artifact, because the two ask different
      # services: this asks the REST endpoint
      # /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts, while
      # deploy-pages calls ListArtifacts on the twirp results service
      # (src/internal/api-client.js in v5). Measured on run d3b724a: this step
      # was satisfied on its first check at 06:38:45.24, and deploy-pages was
      # told "Found 0 artifact(s)" at 06:38:45.58 — a third of a second later.
      # The twirp view is the one that lags, and a run step cannot query it,
      # so the retry below is what actually carries the deploy.
      - name: Check that the artifact was really uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$n" -ge 1 ]; then
              echo "github-pages artifact uploaded (visible to REST after $i check(s))"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the github-pages artifact was never uploaded"
          exit 1

      # deploy-pages asks the results service for the artifact and treats a
      # "Found 0 artifact(s)" as final — its backoff covers the polling it does
      # after a deployment exists, not this first lookup. On 25 Nov the same
      # file failed at 06:38 and published at 06:39 with nothing changed, which
      # is what an intermittent lookup looks like. The site is 29 MB, and the
      # bigger the upload the longer the lag, which is why it started biting.
      #
      # Retrying is safe: the lookup throws inside Deployment.create *before*
      # any deployment is created, so a failed attempt leaves nothing behind.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait, then try the deploy once more
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
