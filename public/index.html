<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Play — English for Kids</title>
<meta name="description" content="Interactive English practice for young learners (CEFR A1, ages 7–10).">
<!-- Inline SVG star. The colours must be percent-encoded: a bare "#" would be
     read as the URL fragment and the icon would silently fail to load. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 5 L40 23 L60 25.5 L45 39 L49 58 L32 48 L15 58 L19 39 L4 25.5 L24 23 Z' fill='%23f5a623' stroke='%23e08a10' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">

<!-- iOS ignores SVG icons for "Add to Home Screen"; it needs a raster one.
     Generated by make-icon.py in the project root. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Word Play">
<meta name="theme-color" content="#fff8ef">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="bar">
  <button class="bar-btn" id="backBtn" hidden aria-label="Go back">←</button>
  <h1 class="bar-title" id="barTitle">Word Play</h1>
  <button class="bar-btn bar-btn-quiet" id="teacherBtn" aria-label="Teacher panel">👩‍🏫</button>
  <button class="bar-btn" id="soundBtn" aria-label="Turn sound off" aria-pressed="true">🔊</button>
</header>

<main id="main">

  <!-- ============ Screen: choose a topic ============ -->
  <section class="screen is-active" id="screen-topic">
    <p class="lead">Choose a topic</p>
    <div class="card-grid" id="topicGrid"></div>
  </section>

  <!-- ============ Screen: choose an activity ============ -->
  <section class="screen" id="screen-activity">
    <p class="lead">Choose a game</p>
    <div class="card-grid" id="activityGrid"></div>
  </section>

  <!-- ============ Screen: the exercise ============ -->
  <section class="screen" id="screen-play">
    <div class="progress" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p class="progress-text" id="progressText" aria-live="polite"></p>

    <p class="task" id="taskHint"></p>

    <div class="stage" id="stage"></div>

    <p class="feedback" id="feedback" role="status" aria-live="assertive"></p>
  </section>

  <!-- ============ Screen: results ============ -->
  <section class="screen" id="screen-done">
    <div class="done-emoji" id="doneEmoji">🎉</div>
    <p class="done-title" id="doneTitle">Well done!</p>
    <p class="done-stars" id="doneStars"></p>
    <p class="done-score" id="doneScore"></p>
    <div class="done-actions">
      <button class="btn btn-primary" id="againBtn">Play again</button>
      <button class="btn" id="changeBtn">Choose another game</button>
    </div>
  </section>

</main>

<!-- ============ Teacher panel (overlay, so a lesson in progress is not lost) ============ -->
<div class="sheet" id="teacherSheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="teacherHeading">
    <div class="sheet-head">
      <h2 id="teacherHeading">Teacher</h2>
      <button class="bar-btn" id="teacherClose" aria-label="Close teacher panel">✕</button>
    </div>

    <div class="sheet-body">
      <section class="block">
        <h3>This session</h3>
        <p class="stat-row" id="teacherStats">Nothing yet.</p>
      </section>

      <section class="block">
        <h3>Needs practice</h3>
        <p class="muted" id="teacherWeakEmpty">Nothing missed yet.</p>
        <ul class="weak-list" id="teacherWeak"></ul>
      </section>

      <section class="block">
        <h3>Every answer</h3>
        <div class="log-wrap">
          <table class="log" id="teacherLog">
            <thead>
              <tr><th>Item</th><th>Game</th><th>Tries</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="block">
        <h3>Voice</h3>
        <label class="muted" for="voiceSelect">Pick the English voice for this device.</label>
        <select id="voiceSelect"></select>
        <div class="block-actions">
          <button class="btn btn-small" id="voiceTest">Test voice</button>
          <button class="btn btn-small" id="voiceReset">Use default</button>
        </div>
      </section>

      <section class="block">
        <div class="block-actions">
          <button class="btn btn-small" id="logClear">Clear session record</button>
        </div>
      </section>
    </div>
  </div>
</div>


<!-- Site footer. Identical on every page, so a reader who lands on any one
     sheet can find the rest. -->
<footer class="site-foot">
  <a class="site-mark" href="https://lewistoeic.com/" target="_blank" rel="noopener"
     aria-label="Lewis Biz English"><img src="logo.png" alt="" width="34" height="34"></a>
  <p>更多教材與課程 · More materials and lessons<a href="https://lewistoeic.com/"
    target="_blank" rel="noopener">lewistoeic.com</a></p>
</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
