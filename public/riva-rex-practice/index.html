<title>Riva &amp; Rex — Practice has moved</title>

<!-- The practice papers used to be a page of their own here. They are now the
     second half of the notebook, so this path is kept only so that the URL,
     which was handed out before the merge, still lands somewhere rather than
     404ing. The redirect is a meta refresh because both hosts serve this
     directory as static files and neither can issue a 301.

     canonical + noindex together tell a crawler this is not a page in its own
     right; the notebook it points at is itself noindex, so nothing here is
     asking to be indexed either way. -->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="../riva-rex/#p1">
<meta http-equiv="refresh" content="0; url=../riva-rex/#p1">

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;

    font: 17px/1.6 "Iowan Old Style", Palatino, Georgia, serif;
    text-align: center;
  }
  p { margin: 0 0 14px; max-width: 30rem; }
  .zh { font-family: "PingFang TC", "Heiti TC", "Noto Sans TC", sans-serif; font-size: .9rem; color: #4f6260; }

</style>
</head>
