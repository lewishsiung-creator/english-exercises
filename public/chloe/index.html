<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultation Notes — 諮詢整理</title>
<meta name="description" content="A password-protected consultation page.">

<!-- A consultation, behind a password (Lewis's choice, 2026-11-17). The words
     are encrypted in sealed.js and the PDF in files/chloe-consultation.bin; the plaintext lives under
     private/chloe/, which git ignores. noindex as well, so not even the lock
     screen turns up in a search. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2a4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f2a4a'/%3E%3Crect x='16' y='14' width='32' height='38' rx='4' fill='%23f6f1e8'/%3E%3Cpath d='M22 24h20M22 31h20M22 38h12' stroke='%231f2a4a' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='46' r='7' fill='%23c8502a'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<!-- The lock. Everything below it is encrypted and only exists once the
     password has opened it. -->
<section class="lock" id="lock">
  <div class="lock-card">
    <div class="kick">CONSULTATION NOTES</div>
    <h1>諮詢整理</h1>
    <p class="lock-note">這一頁需要密碼才能開啟。</p>
    <form id="lockForm" autocomplete="off">
      <label for="pw">密碼</label>
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
      <label class="remember"><input type="checkbox" id="remember" checked> 記住這台裝置</label>
      <button type="submit" id="unlockBtn">開啟</button>
      <p class="lock-msg" id="lockMsg" role="alert"></p>
    </form>
    <p class="lock-foot">LEWIS BIZ ENGLISH ｜ 路老師</p>
  </div>
</section>

<div class="toolbar" id="toolbar" hidden>
  <button id="pdfBtn" type="button">下載 PDF</button>
  <button id="lockNow" type="button" class="quiet">這台裝置上鎖</button>
</div>

<main id="doc" class="doc" hidden></main>

<script src="sealed.js"></script>
<script src="render.js"></script>
</body>
</html>
