<text x="920" y="352" fill="#1e2622" font-size="28" letter-spacing="4" text-anchor="middle">SHELL BED</text>
<path d="M920 366V574" fill="none" stroke="#8b948d" stroke-width="1"/><circle cx="920" cy="574" r="4" fill="#8b948d"/>
<text x="78" y="782" fill="#1e2622" font-size="28" letter-spacing="4" text-anchor="start">CONCRETE BASE</text>
<path d="M186 744V528Q186 514 200 514" fill="none" stroke="#8b948d" stroke-width="1"/><circle cx="206" cy="514" r="4" fill="#8b948d"/>
<text x="78" y="124" fill="#1e2622" font-size="34" letter-spacing="4" text-anchor="start">THE STEP DOWN</text>
<text x="78" y="168" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">Each pool is held to the height</text>
<text x="78" y="200" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">of its far edge. Water crosses it</text>
<text x="78" y="232" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">and leaves over the lip.</text>
<text x="1120" y="124" fill="#1e2622" font-size="30" letter-spacing="4" text-anchor="end">THE LIP</text>
<text x="1120" y="166" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="end">is what sets the level of the pool</text>
<text x="1120" y="198" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="end">behind it. The water leaves over</text>
<text x="1120" y="230" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="end">the edge, not through it.</text>
<text x="1120" y="768" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="end">Depth and fall are indicative.</text>
<text x="78" y="824" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="start">SCHEMATIC — two pools of a longer run; the build-up is drawn to explain, not to build from.</text>
</g></svg>