<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="ttl">
<title id="ttl">Schematic diagram of the climb through Awaji Yumebutai: a single route from the entrance at sea level to the upper gardens, doubling back on itself five times, with walls between successive legs and glimpses of the sea opening from two of the turns.</title>
<rect width="1200" height="900" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
<text x="70" y="128" fill="#1e2622" font-size="36" letter-spacing="4" text-anchor="start">WHY YOU GET LOST</text>
<text x="70" y="168" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">The climb doubles back on itself five times. Each turn gives</text>
<text x="70" y="198" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">you one thing and takes the last one away.</text>
<rect x="70" y="370" width="70" height="430" fill="#dbe8ea"/>
