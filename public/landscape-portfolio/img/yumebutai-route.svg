<path d="M98 404 h26" stroke="#7fa3ac" stroke-width="1" opacity=".55"/>
<path d="M80 450 h30" stroke="#7fa3ac" stroke-width="1" opacity=".55"/>
<path d="M98 496 h26" stroke="#7fa3ac" stroke-width="1" opacity=".55"/>
<path d="M80 542 h30" stroke="#7fa3ac" stroke-width="1" opacity=".55"/>
<path d="M98 588 h26" stroke="#7fa3ac" stroke-width="1" opacity=".55"/>
