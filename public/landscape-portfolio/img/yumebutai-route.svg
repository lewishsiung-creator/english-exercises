<path d="M98 680 h26" stroke="#7fa3ac" stroke-width="1" opacity=".55"/>
<path d="M80 726 h30" stroke="#7fa3ac" stroke-width="1" opacity=".55"/>
<path d="M98 772 h26" stroke="#7fa3ac" stroke-width="1" opacity=".55"/>
<polygon points="280,621 142,556 142,686" fill="#8b948d" opacity=".12"/>
<path d="M280 621 L142 556 M280 621 L142 686" fill="none" stroke="#8b948d" stroke-width="1"/>
<polygon points="280,441 142,376 142,506" fill="#8b948d" opacity=".12"/>
<path d="M280 441 L142 376 M280 441 L142 506" fill="none" stroke="#8b948d" stroke-width="1"/>
<text x="164" y="448" fill="#7fa3ac" font-size="24" letter-spacing="4" text-anchor="start">SEA</text>
<text x="164" y="628" fill="#7fa3ac" font-size="24" letter-spacing="4" text-anchor="start">SEA</text>
<path d="M400 711 H580" stroke="#1e2622" stroke-width="5"/>
<path d="M470 621 H640" stroke="#1e2622" stroke-width="5"/>
<path d="M400 531 H580" stroke="#1e2622" stroke-width="5"/>
<path d="M590 420 H760" stroke="#1e2622" stroke-width="5"/>
<path d="M150 756 H640 A45 45 0 0 0 640 666 H340 A45 45 0 0 1 340 576 H740 A45 45 0 0 0 740 486 H340 A45 45 0 0 1 340 396 H786 Q820 396 847.3 375.7 L1006 258" fill="none" stroke="#9a5a38" stroke-width="3.5" stroke-linecap="round"/>
<path d="M1010.0 255.0 L985.0 261.6 L996.5 277.0 Z" fill="#9a5a38"/>
<circle cx="685" cy="711" r="17" fill="#ffffff" stroke="#1e2622" stroke-width="2.5"/>
<text x="685" y="719" fill="#1e2622" font-size="22" letter-spacing="0" text-anchor="middle">1</text>
<circle cx="295" cy="621" r="17" fill="#ffffff" stroke="#1e2622" stroke-width="2.5"/>
<text x="295" y="629" fill="#1e2622" font-size="22" letter-spacing="0" text-anchor="middle">2</text>
<circle cx="785" cy="531" r="17" fill="#ffffff" stroke="#1e2622" stroke-width="2.5"/>
<text x="785" y="539" fill="#1e2622" font-size="22" letter-spacing="0" text-anchor="middle">3</text>
<circle cx="295" cy="441" r="17" fill="#ffffff" stroke="#1e2622" stroke-width="2.5"/>
<text x="295" y="449" fill="#1e2622" font-size="22" letter-spacing="0" text-anchor="middle">4</text>
<circle cx="819" cy="392" r="17" fill="#ffffff" stroke="#1e2622" stroke-width="2.5"/>
<text x="819" y="400" fill="#1e2622" font-size="22" letter-spacing="0" text-anchor="middle">5</text>
<text x="726" y="720" fill="#1e2622" font-size="24" letter-spacing="3" text-anchor="start">A STAIR</text>
<path d="M722 713 L704 711" stroke="#8b948d" stroke-width="1"/>
<text x="348" y="606" fill="#1e2622" font-size="24" letter-spacing="3" text-anchor="start">A WALL</text>
<path d="M344 600 L312 612" stroke="#8b948d" stroke-width="1"/>
<text x="826" y="540" fill="#1e2622" font-size="24" letter-spacing="3" text-anchor="start">A SHEET OF WATER</text>
<path d="M822 533 L804 531" stroke="#8b948d" stroke-width="1"/>
<text x="348" y="462" fill="#1e2622" font-size="24" letter-spacing="3" text-anchor="start">A GAP WITH THE SEA IN IT</text>
<path d="M344 455 L313 447" stroke="#8b948d" stroke-width="1"/>
<text x="798" y="348" fill="#1e2622" font-size="24" letter-spacing="3" text-anchor="end">THE HUNDRED BEDS</text>
<path d="M802 352 L815 374" stroke="#8b948d" stroke-width="1"/>
<text x="162" y="788" fill="#9a5a38" font-size="26" letter-spacing="3" text-anchor="start">ENTRANCE</text>
<text x="162" y="822" fill="#9a5a38" font-size="26" letter-spacing="3" text-anchor="start">SEA LEVEL</text>
<text x="1130" y="230" fill="#9a5a38" font-size="26" letter-spacing="3" text-anchor="end">UPPER GARDENS</text>
<text x="70" y="248" fill="#1e2622" font-size="30" letter-spacing="4" text-anchor="start">WALLS</text>
<text x="70" y="286" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">The heavy bars. From leg 1 you</text>
<text x="70" y="318" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">cannot see leg 4: each level is</text>
<text x="70" y="350" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">withheld until you stand on it.</text>
<text x="1130" y="806" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="end">Sequence schematic — the point is the order in which things</text>
<text x="1130" y="834" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="end">are given, not the geometry of the path. No scale, no north.</text>
</g></svg>