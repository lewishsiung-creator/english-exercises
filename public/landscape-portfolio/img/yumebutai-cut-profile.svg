<text x="1110" y="397.5" fill="#9a5a38" font-size="26" letter-spacing="3" text-anchor="middle" transform="rotate(-90 1110 397.5)">ORIGINAL HEIGHT</text>
<text x="78" y="118" fill="#1e2622" font-size="36" letter-spacing="3" text-anchor="start">THE CUT</text>
<text x="78" y="156" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">A section taken across the slope.</text>
<text x="78" y="188" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">The dashed line is the hill as it</text>
<text x="78" y="220" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">stood; the solid line is the ground</text>
<text x="78" y="252" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">the quarry left behind.</text>
<text x="78" y="352" fill="#9a5a38" font-size="28" letter-spacing="2.5" text-anchor="start">REMOVED  1950s–1980s</text>
<path d="M462 344 C580 328 680 330 798 356" fill="none" stroke="#9a5a38" stroke-width="1.2"/>
<circle cx="798" cy="356" r="4" fill="#9a5a38"/>
<text x="1030" y="104" fill="#1e2622" font-size="30" letter-spacing="3" text-anchor="end">WHERE IT WENT</text>
<text x="1030" y="142" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="end">Earth cut from this coast went</text>
<text x="1030" y="174" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="end">away by sea, as landfill.</text>
<path d="M760 686L830 686" fill="none" stroke="#9a5a38" stroke-width="2.5" stroke-dasharray="10 8"/>
<text x="846" y="695" fill="#55605a" font-size="25" letter-spacing="2" text-anchor="start">BEFORE QUARRYING</text>
<path d="M760 726L830 726" fill="none" stroke="#1e2622" stroke-width="2.5"/>
<text x="846" y="735" fill="#55605a" font-size="25" letter-spacing="2" text-anchor="start">AFTER QUARRYING</text>
<text x="78" y="776" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="start">SCHEMATIC — the profile before quarrying is inferred from published</text>
<text x="78" y="804" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="start">descriptions and from the shape of the ground that remains. It is not</text>
<text x="78" y="832" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="start">surveyed, and no measured drawing was consulted.</text>
