<text x="70" y="168" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">Soil cut from these hills was barged across Osaka Bay</text>
<text x="70" y="198" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">to make two reclaimed islands. What was left is the site.</text>
