<title id="ttl">Schematic plan of the oval forum at Awaji Yumebutai: an ellipse of wall broken by two openings on opposite sides, paved inside with a grid of joints, crossed by a shallow water channel, entered from below by a flight of steps, with fragments of the surrounding terrace walls and an estimated sixty metre long axis.</title>
