<text x="1027" y="726" fill="#8b948d" font-size="24" letter-spacing="3" text-anchor="middle">N</text>
<text x="70" y="108" fill="#1e2622" font-size="34" letter-spacing="1.5" text-anchor="start">OVAL FORUM</text>
<text x="70" y="152" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">A room without a roof:</text>
<text x="70" y="184" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">an oval of wall, open</text>
<text x="70" y="216" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">at two points where</text>
<text x="70" y="248" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">the route goes through.</text>
<text x="70" y="372" fill="#1e2622" font-size="30" letter-spacing="1.5" text-anchor="start">PAVING</text>
<text x="70" y="410" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">The joints are drawn</text>
<text x="70" y="442" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">as a regular grid. The</text>
<text x="70" y="474" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">real setting-out is</text>
<text x="70" y="506" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">not published.</text>
<text x="70" y="590" fill="#1e2622" font-size="30" letter-spacing="1.5" text-anchor="start">BEYOND</text>
<text x="70" y="628" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">The wall fragments</text>
<text x="70" y="660" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">are the terraces the</text>
<text x="70" y="692" fill="#55605a" font-size="25" letter-spacing="1.2" text-anchor="start">forum is cut out of.</text>
<text x="70" y="748" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="start">SCHEMATIC — the long axis</text>
<text x="70" y="776" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="start">is estimated from published</text>
<text x="70" y="804" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="start">photographs, not measured;</text>
<text x="70" y="832" fill="#8b948d" font-size="22" letter-spacing="1.2" text-anchor="start">north is diagrammatic.</text>
</g></svg>