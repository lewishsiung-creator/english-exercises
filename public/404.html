<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找不到這個頁面 · Page not found</title>
<meta name="robots" content="noindex, nofollow">

<!-- This page is served at whatever URL was asked for, at any depth, so it
     carries no relative paths: no stylesheet, no image, no script file. The
     one link that cannot be written as a constant — the site root, which is
     /english-exercises/ on GitHub Pages and / on Cloudflare — is worked out
     at the bottom from the address it was served at.

     It is also the one page in public/ that any visitor can land on, so it
     names no student, no client and no lesson. -->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%230f5c5c' stroke-width='5'/%3E%3Cpath d='M32 18v22' stroke='%230f5c5c' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='47' r='1' fill='%230f5c5c'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fbfaf7">

<style>
  :root {
    --paper: #fbfaf7;
    --ink: #23282d;
    --ink-soft: #5d6670;
    --accent: #0f5c5c;
    --accent-soft: #e8f1ef;
    --accent-line: #bcd6d1;
    --line: #e5e1d8;

    --font-en: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, serif;
    --font-zh: "PingFang TC", "Heiti TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #16181a;
      --ink: #e8e6e1;
      --ink-soft: #a8adb3;
      --accent: #6fcfc4;
      --accent-soft: #19302e;
      --accent-line: #2f5a55;
      --line: #2c3033;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-en);
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }

  main { max-width: 32rem; }

  .mark {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px;
  }

  h1 { margin: 0 0 6px; font-size: 1.9rem; font-weight: 600; line-height: 1.2; }
  h1 .zh { display: block; font-family: var(--font-zh); font-size: 1.05rem; font-weight: 400; color: var(--ink-soft); margin-top: 8px; }

  p { margin: 18px 0 0; font-size: 1.02rem; }
  p .zh { display: block; font-family: var(--font-zh); font-size: .86rem; color: var(--ink-soft); margin-top: 5px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }

  .btn {
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--accent-line);
    border-radius: 8px;
    padding: 9px 15px;
    text-decoration: none;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn-quiet { color: var(--ink-soft); border-color: var(--line); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>

<main>
  <p class="mark">404</p>

  <h1>
    This page isn’t here
    <span class="zh">找不到這個頁面</span>
  </h1>

  <p>
    The link may be out of date, or the page may have been renamed. If someone
    sent you here, ask them for the current link.
    <span class="zh">這個連結可能已經過期，或頁面已經改名。如果是別人傳給你的，請向對方索取最新的連結。</span>
  </p>

  <div class="actions">
    <button class="btn" type="button" onclick="history.back()">
      ← Go back <span lang="zh-Hant">回上一頁</span>
    </button>
    <a class="btn btn-quiet" id="home" href="https://lewistoeic.com/">
      Home <span lang="zh-Hant">首頁</span>
    </a>
    <a class="btn btn-quiet" href="https://lewistoeic.com/" target="_blank" rel="noopener">
      lewistoeic.com
    </a>
  </div>
</main>

<script>
  /* The site root differs by host — /english-exercises/ on GitHub Pages, /
     on Cloudflare Pages — and this page can be served at any depth, so it is
     read off the address rather than written down. */
  var seg = location.pathname.split('/')[1];
  document.getElementById('home').href =
    location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
</script>

</body>
</html>
