<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>已搬家 · 國中英語精熟</title>

<!-- This page was the 國中單字 half until 2026-08-21, when 單字 and 文法 were
     merged into one page at /junior-high/. The URL was already handed out, so
     it stays as a redirect rather than becoming a 404.

     The hash has to be translated, not just carried: the merged page namespaces
     its anchors by half and by grade, because a grammar unit id (u1…u14) exists
     in more than one grade. This page's own anchors were 七年級's, so that is
     the grade they map to. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="../junior-high/">
<script>
  (function () {
    var h = location.hash.replace(/^#/, '');
    var to = '../junior-high/';
    if (h) {
      // /junior-high-grammar/#for-b1-l5 — the merged page resolves the grade.
      to += h.indexOf('for-') === 0 ? '#g/' + h : '#w/g7/' + h;
    } else {
      to += '#w/';
    }
    location.replace(to);
  }());
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f7f4;
    color: #58636f;
    font-family: "PingFang TC", "Heiti TC", "Noto Sans TC", sans-serif;
    text-align: center;
    line-height: 1.9;
  }
  a { color: #14655c; font-weight: 700; }
</style>
</head>
<body>
  <!-- Shown only if the script does not run. -->
  <p>國中單字已經和文法合併成同一頁了。<br>
    <a href="../junior-high/">📚 前往新的頁面</a></p>
</body>
</html>
