<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep Speaking — 繼續開口</title>
<meta name="description" content="跨文化溝通課程的課後練習：四大功能句型、六個情境演練、BLUF Email，全部可以開口練。">

<!-- Built from a client's course handbook, and its scenarios are written about
     that company. Kept out of search results; the trainees get it by URL. -->
<meta name="robots" content="noindex, nofollow">

<!-- Inline SVG mark: a speech bubble. The colours must be percent-encoded — a
     bare "#" would be read as the URL fragment. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c2b4a'/%3E%3Cpath d='M14 18h36v22H30l-9 8v-8h-7z' fill='%23f2b544'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f7f5f0">

<!-- A student gets this page as a link in LINE, so the preview is its first
     impression. An image has to be an absolute URL, and it points at the
     Cloudflare site, the one the link is handed out on. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Keep Speaking 繼續開口">
<meta property="og:description" content="你的英文不需要完美。需要的是繼續開口。句型、情境和 Email，每天三分鐘開口練。">
<meta property="og:url" content="https://english-exercises-6e4.pages.dev/keep-speaking/">
<meta property="og:image" content="https://english-exercises-6e4.pages.dev/keep-speaking/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Keep Speaking 繼續開口">
<meta name="twitter:card" content="summary_large_image">

<!-- The home-screen icon. display is "browser" in the manifest on purpose: the
     page opens in the browser, not as a separate app. On an iPhone a separate
     app can keep its own storage, and a trainee's count must not depend on
     which icon they tapped. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="繼續開口">

<link rel="stylesheet" href="style.css">

<!-- The house typography, then the house interface, linked last so they win.
     Neither sets colour; this page keeps the handbook's navy and amber. -->
<link rel="stylesheet" href="../type.css">
<link rel="stylesheet" href="../house.css">
</head>
<body>

<a class="skip" href="#view">跳到內容 Skip to content</a>

<header class="bar">
  <a class="bar-title" href="#today">Keep Speaking <span>繼續開口</span></a>

  <nav class="tabs tabs-top" aria-label="主選單"></nav>

  <a class="bar-btn tally-pill" href="#today" aria-label="你開口的次數">開口 <b class="tally-n">0</b></a>
  <button class="bar-btn bar-btn-zh" id="zhToggle" aria-pressed="true" title="顯示或隱藏英文句子的中譯">中譯</button>
  <button class="bar-btn bar-btn-quiet" id="panelToggle" aria-expanded="false"
          aria-controls="panel" title="設定" aria-label="設定">⚙</button>
</header>

<main id="view"></main>

<!-- The tabs live at the bottom on a phone, where the thumb is. -->
<nav class="tabs tabs-bottom" aria-label="主選單"></nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="panel" id="panel" role="dialog" aria-label="設定" hidden>
  <div class="panel-head">
    <h2>設定 <span>Settings</span></h2>
    <button class="panel-x" id="panelClose" aria-label="關閉">✕</button>
  </div>

  <div class="row">
    <label for="voicePick">發音 <em>Voice</em></label>
    <select id="voicePick"></select>
    <p class="row-note">供 🔊 使用。選擇後會播放一段範例。這是機器的聲音：拿它練發音和重音就好，語調要跟真人學。</p>
  </div>

  <div class="row">
    <label for="rate">語速 <em>Speed</em></label>
    <select id="rate">
      <option value="0.75">慢 Slow</option>
      <option value="0.95">正常 Normal</option>
      <option value="1.1">快 Brisk</option>
    </select>
  </div>

  <div class="row">
    <label>我的紀錄 <em>My record</em></label>
    <p class="row-note">開口次數、小抄、週五檢查和反思筆記，都只存在這台裝置的這個瀏覽器，不會傳給任何人。錄音只在這一頁播放，不會存下來，也不會上傳。</p>
    <button class="panel-btn" id="clearAll">清除我的紀錄</button>
    <span id="clearAsk"></span>
  </div>
</div>

<!-- Site footer. Identical on every page, so a reader who lands on any one
     sheet can find the rest. -->
<footer class="site-foot">
  <a class="site-mark" href="https://lewistoeic.com/" target="_blank" rel="noopener"
     aria-label="Lewis Biz English"><img src="../logo.png" alt="" width="34" height="34"></a>
  <p>更多教材與課程 · More materials and lessons<a href="https://lewistoeic.com/"
    target="_blank" rel="noopener">lewistoeic.com</a></p>
</footer>

<script src="content.js"></script>
<script src="render.js"></script>
</body>
</html>
