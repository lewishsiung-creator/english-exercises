       the grade, the mode, or a drill in progress on the other side. -->

    <button class="section-btn is-on" id="secWords" aria-pressed="true" title="單字" aria-label="單字">📚<span class="lbl"> 單字</span></button>
    <button class="section-btn" id="secGrammar" aria-pressed="false" title="文法" aria-label="文法">✎<span class="lbl"> 文法</span></button>

  <p class="bar-title" id="barTitle">國中英語精熟 <span>Grade 7–9</span></p>

  <div id="nav"></div>
  <main id="doc"></main>

<div class="nav-scrim" hidden></div>

<!-- Settings. Opens over the page rather than replacing it, so a quiz in
     progress is never lost. Rows marked data-mode or data-section only appear
     where they apply. -->
<div class="panel" id="panel" role="dialog" aria-label="設定" hidden>
  <div class="panel-head">
    <h2>設定 <span>Settings</span></h2>
    <button class="panel-x" id="panelClose" aria-label="關閉">✕</button>
  </div>

  <div class="row" data-mode="class">
    <label class="row-check">
      <input type="checkbox" id="revealAll">
      <span>攤開全部答案 <em>Reveal every answer</em></span>
    </label>
    <p class="row-note">教學模式預設把該由學生想出來的部分藏起來——單字的中譯，
      文法的句型中譯與正確寫法。這個開關一次全部打開，用來對答案。</p>
  </div>

  <div class="row" data-mode="study">
    <label for="maskPick">遮字自測</label>
    <select id="maskPick"></select>
    <p class="row-note">被遮住的地方點一下就會露出來，只露那一個。</p>
  </div>

  <div class="row" data-mode="study">
    <label class="row-check">
      <input type="checkbox" id="onlyUnknown">
      <span>只看還沒打勾的 <em>Hide the ones marked 會了</em></span>
    </label>
  </div>

  <div class="row">
    <label for="voicePick">朗讀語音</label>
    <select id="voicePick"></select>
    <p class="row-note">🔊 用的聲音。選一個會先唸一句給你聽。</p>
  </div>

  <div class="row">
    <label for="rate">速度</label>
    <select id="rate">
      <option value="0.7">慢</option>
      <option value="0.9">正常</option>
      <option value="1.05">快</option>
    </select>
  </div>

  <div class="row">
    <button class="panel-btn panel-btn-quiet" id="printBtn">列印目前這一份</button>
    <p class="row-note" id="printNote"></p>
  </div>

  <div class="row" data-mode="study">
    <button class="panel-btn panel-btn-quiet" id="clearMarks">清除「會了」的紀錄</button>
    <p class="row-note" id="marksNote"></p>
  </div>

  <div class="row" data-mode="class">
    <button class="panel-btn panel-btn-quiet" id="resetClass">換下一個學生</button>
    <p class="row-note">教學模式不會存任何紀錄，這個按鈕只是把畫面收乾淨：
      關掉攤開的答案、收起小考與練習。語音設定會留著。</p>
  </div>
</div>
