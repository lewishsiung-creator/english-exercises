<main id="doc" class="pp-main"></main>

<div class="panel" id="panel" role="dialog" aria-label="設定" hidden>
  <div class="panel-head">
    <h2>設定 <span>Settings</span></h2>
    <button class="panel-x" id="panelClose" aria-label="關閉">✕</button>
  </div>

  <!-- Teacher-only rows: shown on a teacher's device (learn/teacher.js). -->
  <div class="row teacher-only">
    <button class="panel-btn" id="showAll">全部顯示答案</button>
    <p class="row-note">每一部分都直接顯示答案，適合投影對答案。不會動到學生打的字。</p>
  </div>
  <div class="row teacher-only">
    <button class="panel-btn panel-btn-quiet" id="hideAll">全部收起</button>
    <p class="row-note">回到還沒作答的樣子。</p>
  </div>

  <div class="row">
    <label for="voicePick">朗讀聲音</label>
    <select id="voicePick"></select>
    <p class="row-note">🔊 按鈕用的聲音，選好會立刻試聽。</p>
  </div>
  <div class="row">
    <label for="rate">語速</label>
    <select id="rate">
      <option value="0.75">慢</option>
      <option value="0.95">正常</option>
      <option value="1.1">快</option>
    </select>
  </div>

  <div class="row">
    <button class="panel-btn panel-btn-quiet" id="wipe">清除這頁的作答</button>
    <p class="row-note">打過的字只存在這台裝置。換人用這台裝置之前，可以先清掉。</p>
  </div>
</div>
