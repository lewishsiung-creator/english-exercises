<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英文學習 — 國中單字、高中單字、高中閱讀</title>
<meta name="description" content="國中單字、高中單字、高中英文閱讀，三頁放在一起：從教育部 2,000 字開始，接大考中心參考詞彙表，再讀高中程度的文章。">

<!-- The top page for three pages and only three: /reading/, /reading/vocab/
     and /reading/junior-vocab/. Lewis chose (2026-11-08) a top page over this
     family, not a site-wide index -- his October decision stands that students
     must not find each other's material, so nothing with a student or client
     in it is ever linked from here. The three pages keep their own URLs; each
     links back up. noindex, like all three. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%231d1d1f'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="gnav" aria-label="網站">
  <div class="wrap"><span class="brand">英文學習</span></div>
</nav>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">國中 · 高中</p>
    <h1 class="hero-title">英文學習</h1>
  </div>
</header>

<!-- In the order a student climbs: 國中 words, 高中 words, then 高中 texts.
     The numbers are typed here rather than read from the pages' data, so
     update them when a page grows (高中單字 gains a level, the reading page a
     text). -->
<main class="band">
  <div class="wrap">
    <!-- 今天的複習: the words due today on both word pages, read from this
         browser's own records (hsv.* and jhv.*, the pages' self-study marks).
         Drawn by learn.js; stays hidden for a student who has not used either
         page yet, for whom the check below is the way in. -->
    <section class="today" id="today" aria-labelledby="todayTitle" hidden></section>

    <!-- The way in for a student who does not know where to start. After a
         check, the line under it names where the check said to begin; that
         result lives only in this browser (lc.result, written by check/). -->
    <a class="check-cta" href="check/">
      <span class="cc-q">不知道從哪裡開始？</span>
      <span class="cc-go">做 4 分鐘程度檢測 ›</span>
    </a>
    <p class="check-last" id="checkLast" hidden></p>
    <div class="tiles">
      <a class="tile" href="../reading/junior-vocab/">
        <span class="step">第一步</span>
        <span class="num">2,146</span>
        <span class="unit">個字</span>
        <span class="title">國中單字</span>
        <span class="desc">教育部 108 課綱參考字彙表 2,000 字，加上七、八年級課本單字，照課次排、連到文法。可以翻閃卡、做測驗。</span>
        <span class="go">開始 ›</span>
      </a>
      <a class="tile" href="../reading/vocab/">
        <span class="step">第二步</span>
        <span class="num">2,004</span>
        <span class="unit">個字</span>
        <span class="title">高中單字</span>
        <span class="desc">大考中心《高中英文參考詞彙表》第一、二級。學測的字，一級一級來；第三到第六級陸續加入。</span>
        <span class="go">開始 ›</span>
      </a>
      <a class="tile" href="../reading/">
        <span class="step">第三步</span>
        <span class="num">3</span>
        <span class="unit">篇文章</span>
        <span class="title">高中英文閱讀</span>
        <span class="desc">三篇高中程度的文章，附中譯、閱讀測驗、克漏字，最後有四關單字、片語和搭配詞複習。</span>
        <span class="go">開始 ›</span>
      </a>
    </div>
  </div>
</main>

<footer class="notes">
  <div class="wrap">
    <p>更多教材與課程 · <a href="https://lewistoeic.com/" target="_blank" rel="noopener">lewistoeic.com</a></p>
  </div>
</footer>

<script src="learn.js"></script>
</body>
</html>
