<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- The title is rewritten by render.js from content.js. -->
<title>商務團隊會議 · 共同籌辦指南</title>
<meta name="description" content="A meeting preparation guide written for one student.">

<!-- This page names a dozen of one student's colleagues and an internal
     agenda, so it is kept out of search results. It stays reachable by its URL
     for her — noindex keeps it unfindable, not secret. -->
<meta name="robots" content="noindex, nofollow">

<!-- Inline SVG mark: two seats at one table — the page is about co-planning,
     not presenting. In the page's own palette: near-black ground, one accent
     blue. Colours percent-encoded, or "#" ends the URL. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1c1f'/%3E%3Crect x='12' y='30' width='40' height='4' rx='2' fill='%23ffffff'/%3E%3Ccircle cx='22' cy='21' r='6' fill='%231c23ba'/%3E%3Ccircle cx='42' cy='21' r='6' fill='%23ffffff'/%3E%3Crect x='17' y='38' width='10' height='11' rx='2' fill='%2355575c'/%3E%3Crect x='37' y='38' width='10' height='11' rx='2' fill='%2355575c'/%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="style.css">

<!-- The house typography, shared by every page. Linked AFTER this page's own
     stylesheet so its definitions win — which is why the display face here is
     --font-display and not --font-en, a serif this file would lose to.
     See ../../type.css. -->
<link rel="stylesheet" href="../../type.css">

<!-- The Intuitive palette, shared with the notebook next door. It replaces
     ../../editorial.css, which repaints the adult family near-black and red:
     this page's colour is chosen on purpose and follows intuitive.com, where
     Anny works. See ../../intuitive.css. -->
<link rel="stylesheet" href="../../intuitive.css">

<!-- The house interface, shared by every page in the family: the bar, the
     controls, the display type and the hairlines. Linked LAST so it wins, and
     it deliberately sets no body size, no measure and no colour of its own.
     See ../../house.css. -->
<link rel="stylesheet" href="../../house.css">

</head>
<body>

<a class="skip" href="#doc">跳到內容</a>

<header class="bar">
  <button class="bar-btn" id="navToggle" aria-expanded="false" aria-controls="nav">
    <span aria-hidden="true">☰</span> <span id="navToggleLabel">目錄</span>
  </button>

  <p class="bar-title">商務團隊會議 <span>共同籌辦指南</span></p>

  <!-- The clock. One button: tap to start, tap again to pause. It lights the
       row of the 30-minute plan the conversation is in. -->
  <button class="bar-btn bar-btn-clock" id="clockBtn" aria-pressed="false"
          title="開始／暫停計時">⏱ 開始</button>

  <button class="bar-btn bar-btn-quiet" id="panelToggle" aria-expanded="false"
          aria-controls="panel" title="工具" aria-label="工具">⚙</button>

  <!-- How far down a page that runs to twenty-odd screens on a phone. Drawn
       on the bar's own bottom edge, so it costs no height. -->
  <div class="bar-progress" aria-hidden="true"><i id="progress"></i></div>
</header>

<!-- The running clock, following the reader down the page. The 30-minute plan
     lives in section 02, and a clock that only tells you where you are while
     you are parked on that one section is no use during the conversation it is
     there to pace. Present only while the clock runs; tapping it goes back to
     the plan. -->
<button class="nowbar" id="nowbar" hidden>
  <span class="now-when" id="nowWhen"></span>
  <span class="now-what" id="nowWhat"></span>
  <span class="now-go" aria-hidden="true">↗</span>
</button>

<div class="shell">
  <div id="nav">
    <!-- Static, so it survives the renderer appending the contents list after
         it: the way back to the notebook this page belongs to. -->
    <nav class="toc toc-up" aria-label="其他頁面">
      <p class="toc-head">其他頁面</p>
      <ul><li><a href="../"><span class="n">↩</span>
        <span class="t">Anny 的英文筆記</span></a></li></ul>
    </nav>
  </div>
  <main id="doc"></main>
</div>

<div class="nav-scrim" hidden></div>

<!-- Tools. Opens over the page rather than replacing it, so a discussion in
     progress is never lost. -->
<div class="panel" id="panel" role="dialog" aria-label="工具" hidden>
  <div class="panel-head">
    <h2>工具</h2>
    <button class="panel-x" id="panelClose" aria-label="關閉">✕</button>
  </div>

  <div class="row">
    <button class="panel-btn" id="copyAll">複製決議</button>
    <p class="row-note">把「會後紀錄」、下一步的負責人與期限，以及還沒勾選的檢核項目，
      整理成一段文字複製起來，可以直接貼到信件或訊息裡。</p>
  </div>

  <div class="row">
    <button class="panel-btn panel-btn-quiet" id="print">列印這份指南</button>
    <p class="row-note">勾選與填寫的內容都會一起印出來，計時與按鈕不會。</p>
  </div>

  <div class="row">
    <button class="panel-btn panel-btn-quiet" id="clear">清空本頁紀錄</button>
    <p class="row-note">清掉這台裝置上的勾選、填寫與計時。指南內容不受影響。</p>
  </div>
</div>

<!-- Twenty-odd screens on a phone, and the contents list is behind the ☰.
     Appears once there is a way back worth having. -->
<button class="totop" id="toTop" hidden aria-label="回到最上面">↑</button>

<!-- Site footer. Identical on every page, so a reader who lands on any one
     sheet can find the rest. -->
<footer class="site-foot">
  <a class="site-mark" href="https://lewistoeic.com/" target="_blank" rel="noopener"
     aria-label="Lewis Biz English"><img src="../../logo.png" alt="" width="34" height="34"></a>
  <p>更多教材與課程 · More materials and lessons<a href="https://lewistoeic.com/"
    target="_blank" rel="noopener">lewistoeic.com</a></p>
</footer>

<!-- Order matters: the page, then the renderer. -->
<script src="content.js"></script>
<script src="render.js"></script>
</body>
</html>
