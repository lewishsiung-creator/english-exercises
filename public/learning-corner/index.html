<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Corner · 學習角</title>
<meta name="description" content="One child's learning pages in one place. 一個孩子的學習頁面，放在一起。">

<!-- A family page: the one place a Grade 1 child opens to reach his own
     pages (built 2026-11-18 at Lewis's request). Three rules it keeps:

     1. No child, school or teacher is named here or in the URL — the same
        habit as /math/ and /museum-trip/.
     2. The picture-book page is NOT in this repo and its address is NOT in
        this file. It is a private, link-shared page of copyrighted books, and
        this repo is public. The address arrives in the link the family uses
        (#books=…, see app.js) and is kept on that device only. Opened without
        it, this page simply shows the other doors. Never write that address
        into this folder or the README.
     3. Nothing with a student or client in it is ever linked from here. This
        is a family hub, not an index of the site (Lewis's October decision
        that students must not find each other's material still stands). -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffb020'/%3E%3Cpath d='M32 12l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z' fill='%23ffffff'/%3E%3C/svg%3E">
<!-- The kids' home-screen star, as on the other children's pages. -->
<link rel="apple-touch-icon" href="../star-icon.png">
<meta name="apple-mobile-web-app-title" content="Learning Corner">
<meta name="theme-color" content="#fff8ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17151c" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<main class="corner">

  <header class="hello">
    <h1><span lang="en">Learning Corner</span> <span class="hello-zh" lang="zh-Hant">學習角</span></h1>
    <p class="ask"><span lang="en">What shall we do today?</span> <span class="ask-zh" lang="zh-Hant">今天想做什麼？</span></p>
  </header>

  <!-- One door per page. Each is a plain link, so it works with no script;
       only the book door waits for app.js. To add a page later: copy a door,
       give it a class with its own --tint / --accent in style.css, and draw
       its picture in the same 200 × 130 box. -->
  <nav class="doors" aria-label="Pages 頁面">

    <a class="door door-math" href="../math/">
      <span class="door-art" aria-hidden="true">
        <svg viewBox="0 0 200 130" focusable="false">
          <g transform="rotate(-8 52 70)">
            <rect x="24" y="42" width="56" height="56" rx="14" fill="#3b82d6"/>
            <text x="52" y="84" text-anchor="middle" class="art-num">1</text>
          </g>
          <g transform="rotate(5 100 58)">
            <rect x="72" y="30" width="56" height="56" rx="14" fill="#f08c2e"/>
            <text x="100" y="72" text-anchor="middle" class="art-num">2</text>
          </g>
          <g transform="rotate(-4 148 72)">
            <rect x="120" y="44" width="56" height="56" rx="14" fill="#22a06b"/>
            <text x="148" y="86" text-anchor="middle" class="art-num">3</text>
          </g>
          <g stroke="#8b5cf6" stroke-width="6" stroke-linecap="round">
            <path d="M30 20h18M39 11v18"/>
            <path d="M158 112h18M158 122h18"/>
          </g>
        </svg>
      </span>
      <span class="door-words">
        <span class="door-name" lang="en">Number Lab</span>
        <span class="door-zh" lang="zh-Hant">數學練習</span>
        <span class="door-blurb" lang="en">Count, add, tell the time.</span>
      </span>
      <span class="door-go" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>

    <!-- Hidden until app.js knows where the books are (see rule 2 above).
         No href here on purpose. -->
    <a class="door door-books" id="booksDoor" rel="noopener noreferrer" hidden>
      <span class="door-art" aria-hidden="true">
        <svg viewBox="0 0 200 130" focusable="false">
          <rect x="44" y="26" width="24" height="78" rx="5" fill="#e8734a"/>
          <rect x="44" y="40" width="24" height="7" fill="#fff" opacity=".55"/>
          <rect x="71" y="38" width="20" height="66" rx="5" fill="#3b82d6"/>
          <rect x="71" y="82" width="20" height="7" fill="#fff" opacity=".55"/>
          <rect x="94" y="20" width="28" height="84" rx="5" fill="#22a06b"/>
          <path d="M108 44l3.5 7.5 8 1-6 5.6 1.6 8-7.1-4-7.1 4 1.6-8-6-5.6 8-1z" fill="#ffd23f"/>
          <g transform="rotate(16 142 104)">
            <rect x="129" y="34" width="24" height="70" rx="5" fill="#8b5cf6"/>
            <rect x="129" y="48" width="24" height="7" fill="#fff" opacity=".55"/>
          </g>
          <rect x="22" y="104" width="156" height="12" rx="6" fill="#c99863"/>
          <rect x="22" y="111" width="156" height="5" rx="2.5" fill="#9e6b3b"/>
        </svg>
      </span>
      <span class="door-words">
        <span class="door-name" lang="en">Book Nook</span>
        <span class="door-zh" lang="zh-Hant">互動故事書</span>
        <span class="door-blurb" lang="en">Tap a book to read.</span>
      </span>
      <span class="door-go" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>

    <a class="door door-museum" href="../museum-trip/">
      <span class="door-art" aria-hidden="true">
        <svg viewBox="0 0 200 130" focusable="false">
          <circle cx="160" cy="28" r="14" fill="#ffd23f"/>
          <g stroke="#ffd23f" stroke-width="4" stroke-linecap="round">
            <path d="M160 5v5M160 46v5M137 28h5M178 28h5M144 12l3.5 3.5M173 41l3.5 3.5M144 44l3.5-3.5M173 15l3.5-3.5"/>
          </g>
          <path d="M100 22l62 30H38z" fill="#fff"/>
          <circle cx="100" cy="41" r="6" fill="#e8734a"/>
          <rect x="44" y="52" width="112" height="8" rx="2" fill="#f1e6da"/>
          <g fill="#fff">
            <rect x="52" y="60" width="14" height="40" rx="3"/>
            <rect x="80" y="60" width="14" height="40" rx="3"/>
            <rect x="106" y="60" width="14" height="40" rx="3"/>
            <rect x="134" y="60" width="14" height="40" rx="3"/>
          </g>
          <rect x="40" y="100" width="120" height="8" rx="2" fill="#fff"/>
          <rect x="30" y="108" width="140" height="9" rx="3" fill="#f1e6da"/>
        </svg>
      </span>
      <span class="door-words">
        <span class="door-name" lang="en">Museum Trip</span>
        <span class="door-zh" lang="zh-Hant">博物館之旅</span>
        <span class="door-blurb" lang="en">The story of Taiwan.</span>
      </span>
      <span class="door-go" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M9 5l7 7-7 7"/></svg></span>
    </a>

  </nav>

</main>

<script src="app.js?v=1"></script>
</body>
</html>
