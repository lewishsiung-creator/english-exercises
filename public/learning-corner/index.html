<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Corner · 學習角</title>
<meta name="description" content="One child's learning pages in one place. 一個孩子的學習頁面，放在一起。">

<!-- A family page: the one place a Grade 1 child opens to reach his own
     pages (built 2026-11-18 at Lewis's request). Three rules it keeps:

     1. No child, school or teacher is named here or in the URL — the same
        habit as /math/ and /museum-trip/.
     2. The picture-book page is NOT in this repo and its address is NOT in
        this file. It is a private, link-shared page of copyrighted books, and
        this repo is public. The address arrives in the link the family uses
        (#books=…, see app.js) and is kept on that device only. Opened without
        it, this page simply shows the other doors. Never write that address
        into this folder or the README.
     3. Nothing with a student or client in it is ever linked from here. This
        is a family hub, not an index of the site (Lewis's October decision
        that students must not find each other's material still stands).

     The look (2026-11-18, see the README for what was asked): a superhero comic page —
     ink outlines, hard offset shadows, halftone dots, burst rays, slanted
     heavy capitals. Design language only: no publisher's or team's name,
     logo, emblem, character, costume, slogan or licensed typeface is on this
     page, and none may be added. It is public. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffb020'/%3E%3Cpath d='M32 12l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z' fill='%23ffffff'/%3E%3C/svg%3E">
<!-- The kids' home-screen star, as on the other children's pages. -->
<link rel="apple-touch-icon" href="../star-icon.png">
<meta name="apple-mobile-web-app-title" content="Learning Corner">
<meta name="theme-color" content="#2632a0">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<main class="corner">

  <header class="hello">
    <h1><span lang="en">Learning Corner</span> <span class="hello-zh" lang="zh-Hant">學習角</span></h1>
    <p class="ask"><span lang="en">What shall we do today?</span> <span class="ask-zh" lang="zh-Hant">今天想做什麼？</span></p>
  </header>

  <!-- One door per page, each a comic panel. A door is a plain link, so it
       works with no script; only the book door waits for app.js. To add a
       page later: copy a door, give it a class with its own --panel colours
       in style.css, and draw its picture in the same 200 × 130 box. Shapes
       inside <g class="ink"> get the black comic outline; anything outside
       it is drawn flat. -->
  <nav class="doors" aria-label="Pages 頁面">

    <a class="door door-math" href="../math/">
      <span class="door-art" aria-hidden="true">
        <svg viewBox="0 0 200 130" focusable="false">
          <g class="ink">
            <path d="M34 10h10v8h8v10h-8v8H34v-8h-8V18h8z" fill="#fff"/>
            <rect x="154" y="104" width="26" height="8" rx="2" fill="#fff"/>
            <rect x="154" y="116" width="26" height="8" rx="2" fill="#fff"/>
            <g transform="rotate(-8 52 70)">
              <rect x="24" y="42" width="56" height="56" rx="12" fill="#ffd60a"/>
            </g>
            <g transform="rotate(5 100 58)">
              <rect x="72" y="30" width="56" height="56" rx="12" fill="#fff"/>
            </g>
            <g transform="rotate(-4 148 72)">
              <rect x="120" y="44" width="56" height="56" rx="12" fill="#2f6fe0"/>
            </g>
          </g>
          <text x="52" y="85" text-anchor="middle" class="art-num" fill="#14121f" transform="rotate(-8 52 70)">1</text>
          <text x="100" y="73" text-anchor="middle" class="art-num" fill="#e23636" transform="rotate(5 100 58)">2</text>
          <text x="148" y="87" text-anchor="middle" class="art-num" fill="#fff" transform="rotate(-4 148 72)">3</text>
        </svg>
      </span>
      <span class="door-words">
        <span class="door-name" lang="en"><span>Number Lab</span></span>
        <span class="door-zh" lang="zh-Hant">數學練習</span>
        <span class="door-blurb" lang="en">Count, add, tell the time.</span>
      </span>
      <span class="door-go" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><polygon points="24,2 28.1,8.6 35,5 35.3,12.7 43,13 39.4,19.9 46,24 39.4,28.1 43,35 35.3,35.3 35,43 28.1,39.4 24,46 19.9,39.4 13,43 12.7,35.3 5,35 8.6,28.1 2,24 8.6,19.9 5,13 12.7,12.7 13,5 19.9,8.6"/><text x="24" y="29" text-anchor="middle">GO!</text></svg></span>
    </a>

    <!-- Hidden until app.js knows where the books are (see rule 2 above).
         No href here on purpose. -->
    <a class="door door-books" id="booksDoor" rel="noopener noreferrer" hidden>
      <span class="door-art" aria-hidden="true">
        <svg viewBox="0 0 200 130" focusable="false">
          <g class="ink">
            <rect x="44" y="26" width="24" height="78" rx="4" fill="#e23636"/>
            <rect x="71" y="38" width="20" height="66" rx="4" fill="#ffd60a"/>
            <rect x="94" y="20" width="28" height="84" rx="4" fill="#fff"/>
            <path d="M108 42l4 8.4 9.2 1.2-6.8 6.4 1.8 9-8.2-4.6-8.2 4.6 1.8-9-6.8-6.4 9.2-1.2z" fill="#e23636"/>
            <g transform="rotate(16 142 104)">
              <rect x="129" y="34" width="24" height="70" rx="4" fill="#19a35b"/>
            </g>
            <rect x="22" y="104" width="156" height="13" rx="3" fill="#f4a428"/>
          </g>
          <rect x="46" y="40" width="20" height="6" fill="#14121f" opacity=".28"/>
          <rect x="73" y="84" width="16" height="6" fill="#14121f" opacity=".28"/>
          <rect x="131" y="48" width="20" height="6" fill="#14121f" opacity=".28" transform="rotate(16 142 104)"/>
        </svg>
      </span>
      <span class="door-words">
        <span class="door-name" lang="en"><span>Book Nook</span></span>
        <span class="door-zh" lang="zh-Hant">互動故事書</span>
        <span class="door-blurb" lang="en">Tap a book to read.</span>
      </span>
      <span class="door-go" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><polygon points="24,2 28.1,8.6 35,5 35.3,12.7 43,13 39.4,19.9 46,24 39.4,28.1 43,35 35.3,35.3 35,43 28.1,39.4 24,46 19.9,39.4 13,43 12.7,35.3 5,35 8.6,28.1 2,24 8.6,19.9 5,13 12.7,12.7 13,5 19.9,8.6"/><text x="24" y="29" text-anchor="middle">GO!</text></svg></span>
    </a>

    <a class="door door-museum" href="../museum-trip/">
      <span class="door-art" aria-hidden="true">
        <svg viewBox="0 0 200 130" focusable="false">
          <path class="rays-under" d="M162 4v7M162 45v7M138 28h7M179 28h7M145 11l5 5M174 40l5 5M145 45l5-5M174 16l5-5"/>
          <path class="rays-over" d="M162 4v7M162 45v7M138 28h7M179 28h7M145 11l5 5M174 40l5 5M145 45l5-5M174 16l5-5"/>
          <g class="ink">
            <circle cx="162" cy="28" r="13" fill="#ffd60a"/>
            <rect x="30" y="108" width="140" height="10" rx="2" fill="#ffe9a8"/>
            <rect x="40" y="99" width="120" height="9" rx="2" fill="#fff"/>
            <rect x="52" y="60" width="14" height="39" fill="#fff"/>
            <rect x="80" y="60" width="14" height="39" fill="#fff"/>
            <rect x="106" y="60" width="14" height="39" fill="#fff"/>
            <rect x="134" y="60" width="14" height="39" fill="#fff"/>
            <rect x="44" y="51" width="112" height="9" rx="2" fill="#ffe9a8"/>
            <path d="M100 20l62 31H38z" fill="#fff"/>
            <circle cx="100" cy="40" r="6" fill="#e23636"/>
          </g>
        </svg>
      </span>
      <span class="door-words">
        <span class="door-name" lang="en"><span>Museum Trip</span></span>
        <span class="door-zh" lang="zh-Hant">博物館之旅</span>
        <span class="door-blurb" lang="en">The story of Taiwan.</span>
      </span>
      <span class="door-go" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><polygon points="24,2 28.1,8.6 35,5 35.3,12.7 43,13 39.4,19.9 46,24 39.4,28.1 43,35 35.3,35.3 35,43 28.1,39.4 24,46 19.9,39.4 13,43 12.7,35.3 5,35 8.6,28.1 2,24 8.6,19.9 5,13 12.7,12.7 13,5 19.9,8.6"/><text x="24" y="29" text-anchor="middle">GO!</text></svg></span>
    </a>

  </nav>

</main>

<script src="app.js?v=3"></script>
</body>
</html>
