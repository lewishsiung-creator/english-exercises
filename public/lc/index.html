<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Corner · 學習角</title>
<!-- A short address for /learning-corner/ (2026-11-18), so the family's link
     is easier to send and to type. It only forwards. Whatever follows # is
     carried over untouched, because that is where the family's key to the
     picture-book door travels (see learning-corner/app.js); it is never sent
     to the server, and this file must never contain it. A script, not a
     meta refresh: a refresh would drop the #. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="../star-icon.png">
<script>location.replace('../learning-corner/' + location.hash);</script>
</head>
<body>
<p><a href="../learning-corner/">Learning Corner · 學習角</a></p>
</body>
</html>
